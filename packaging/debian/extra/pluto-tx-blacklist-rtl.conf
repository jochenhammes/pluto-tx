# pluto-tx: the kernel's DVB-T driver claims RTL2832U dongles as soon as they
# are plugged in and blocks librtlsdr/SoapySDR. Replug an already connected
# RTL-SDR once after installing. To use the dongle as a TV tuner instead:
#   echo "# enabled" | sudo tee /etc/modprobe.d/pluto-tx-blacklist-rtl.conf
blacklist dvb_usb_rtl28xxu

name: web-trx

# Runs on every push/PR (no paths filter on purpose: web-trx imports
# pluto_tx/pluto_advanced_rx, so a change there can break it too).
# GNU Radio is not installed here -- tests that need it skip themselves;
# the full pluto-tx test suite runs on the radio server.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-trx/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check web_trx tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-trx/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run build

  app-control:
    # pluto_tx/webtrx_control.py (+ the real start/stop scripts against a
    # stand-in server) and pluto_tx/webtrx_widget.py -- neither needs GNU Radio.
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install PyQt5
      - run: python -m unittest -v tests.test_webtrx_control tests.test_webtrx_widget
      - run: shellcheck web-trx/scripts/*.sh install-web-trx.sh
